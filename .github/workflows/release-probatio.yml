# Release pipeline for probatio native binaries (R-N4).
#
# Builds native images via `sbt probatioCli/nativeImage` on a matrix of
# platforms, uploads release artifacts (binary + JAR + SHA-256 + SBOM +
# sources), and is CI-reproducible — the same git tag with the same
# toolchain produces byte-identical binaries.
#
# spec: native-packaging — Requirement: The release pipeline SHALL be CI-reproducible
# spec: native-packaging — Requirement: Every release SHALL include per-platform binary, assembly JAR, SHA-256 checksums, SBOM, and sources
#
# Cross-compilation / Rosetta is explicitly rejected (risk R8):
# each platform builds on its NATIVE runner.
#   linux-x86_64  → ubuntu-latest
#   macos-aarch64 → macos-14 (apple-silicon)
#   macos-x86_64  → macos-13 (intel)
#
# Windows-x86_64 is NOT in the matrix — it is JAR-fallback-only.
name: Release Probatio

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  # The toolchain identity the tested binaries carry, in the recorded
  # form <distribution>/<version> that ReleaseCheck requires. It MUST
  # match the build-native matrix below — the release gate enforces
  # this at run time by reading the marker embedded in each binary, so
  # a drift surfaces as a rejection naming both identities.
  # spec: finish-probatio-replacement/delivery-verified — Requirement: The delivered binary is built with the toolchain that was tested
  TESTED_TOOLCHAIN: 'GraalVM CE/21.0.2'

jobs:
  build-native:
    name: Build native binary (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            graalvm-version: '21.0.2'
            graalvm-distribution: 'graalvm-community'
          - platform: macos-aarch64
            os: macos-14
            graalvm-version: '21.0.2'
            graalvm-distribution: 'graalvm-community'
          - platform: macos-x86_64
            os: macos-13
            graalvm-version: '21.0.2'
            graalvm-distribution: 'graalvm-community'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: ${{ matrix.graalvm-version }}
          distribution: ${{ matrix.graalvm-distribution }}
          native-image: true

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build native image
        run: sbt -batch 'probatio-cli/nativeImage'

      - name: Rename binary
        run: |
          mv workflow/cli/target/native-image/probatio probatio-${{ matrix.platform }}

      - name: Compute SHA-256
        run: |
          sha256sum probatio-${{ matrix.platform }} > probatio-${{ matrix.platform }}.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: probatio-${{ matrix.platform }}
          path: |
            probatio-${{ matrix.platform }}
            probatio-${{ matrix.platform }}.sha256

  build-jar-and-sources:
    name: Build assembly JAR, sources JAR, and SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Build assembly JAR
        run: sbt -batch 'probatio-cli/assembly'

      - name: Build sources JAR
        run: sbt -batch 'probatio-cli/sourceJar'

      - name: Rename artifacts
        run: |
          cp workflow/cli/target/scala-*/probatio-cli-assembly-*.jar probatio-assembly.jar
          cp workflow/cli/target/scala-*/probatio-cli_*-sources.jar probatio-sources.jar

      - name: Compute SHA-256 for JARs
        run: |
          sha256sum probatio-assembly.jar > probatio-assembly.jar.sha256
          sha256sum probatio-sources.jar > probatio-sources.jar.sha256

      - name: Generate SBOM
        env:
          # Sbom.validate requires the SBOM version to equal the tag.
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          sbt -batch 'probatio-cli/sbomGenerate'
          # SBOM is generated as probatio-sbom.spdx.json

      - name: Upload JAR and SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: probatio-jars-and-sbom
          path: |
            probatio-assembly.jar
            probatio-assembly.jar.sha256
            probatio-sources.jar
            probatio-sources.jar.sha256
            probatio-sbom.spdx.json

  release:
    name: Publish release
    needs: [build-native, build-jar-and-sources]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      # Release completeness gate (R-N3): the manifest is rebuilt from the
      # downloaded artifact directory and validated by ReleaseValidator.
      # A release that misses an artifact or whose recorded checksums do
      # not reconcile with the checksum sidecars is not delivered.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Validate release manifest
        run: sbt -batch 'probatio-cli/runMain org.sinemenda.probatio.packaging.ReleaseCheck release-artifacts ${{ github.ref_name }} "${{ env.TESTED_TOOLCHAIN }}"'

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/probatio-linux-x86_64
            release-artifacts/probatio-linux-x86_64.sha256
            release-artifacts/probatio-macos-aarch64
            release-artifacts/probatio-macos-aarch64.sha256
            release-artifacts/probatio-macos-x86_64
            release-artifacts/probatio-macos-x86_64.sha256
            release-artifacts/probatio-assembly.jar
            release-artifacts/probatio-assembly.jar.sha256
            release-artifacts/probatio-sources.jar
            release-artifacts/probatio-sources.jar.sha256
            release-artifacts/probatio-sbom.spdx.json
          body: |
            ## Release ${{ github.ref_name }}

            ### Native binaries
            - `probatio-linux-x86_64` — Linux x86_64
            - `probatio-macos-aarch64` — macOS Apple Silicon
            - `probatio-macos-x86_64` — macOS Intel

            ### JAR fallback
            - `probatio-assembly.jar` — Assembly JAR for JAR-fallback platforms

            ### Windows-x86_64
            Windows-x86_64 is JAR-fallback-only. No native binary is produced.
            Use `probatio-assembly.jar` with a JRE.

            ### Verification
            Each artifact has a `.sha256` checksum file. Verify before use:
            ```
            sha256sum -c probatio-linux-x86_64.sha256
            ```

            ### SBOM
            `probatio-sbom.spdx.json` — SPDX 2.3 SBOM
