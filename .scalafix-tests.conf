# Lint configuration for the workflow modules' TEST sources
# (workflow/core, workflow/cli, workflow/plugin — src/test/scala/**).
#
# scalafix has no per-path file scoping: the named `DisableSyntax.*` blocks in
# .scalafix.conf that carry `fileFilter = "glob:..."` rely on a field that does
# not exist on DisableSyntax and therefore never fire. Test-source scoping is
# instead done by wiring `Test / scalafixConfig` to this file in build.sbt for
# exactly the three workflow projects.
#
# The DisableSyntax regexes mirror the root .scalafix.conf so test sources are
# held to the same baseline discipline (the existing `scalafix:ok` markers in
# test files stay meaningful), plus the hermetic-test-processes bans on raw
# process construction — which can NOT be global because workflow main sources
# legitimately spawn processes (GateStateDir, SubcommandEntrypoints, etc.).

rules = [
  DisableSyntax
  RemoveUnused
  OrganizeImports
]

# Scala 3 wildcard imports use `.*` (not `._`); this dialect setting ensures
# OrganizeImports does not rewrite `.*` back to `._`.
OrganizeImports.targetDialect = Scala3

DisableSyntax {
  # ── mirrored from .scalafix.conf ──
  regex = [
    {
      id = NoConfigFactory
      pattern = "\\bConfigFactory\\b"
      message = "Use PureConfig via Adk4sConfig at the app/test edge; do not call ConfigFactory directly."
    },
    {
      id = NoSysEnv
      pattern = "\\bsys\\.env\\b"
      message = "Read config via Adk4sConfig in app/test code; avoid sys.env in libraries."
    },
    {
      id = NoSystemGetenv
      pattern = "\\bSystem\\.getenv\\b"
      message = "Read config via Adk4sConfig in app/test code; avoid System.getenv in libraries."
    },
    {
      id = NoKeywordTry
      # Forbid the try {...} keyword form; allow scala.util.Try(...)
      pattern = "(?s)\\btry\\s*\\{"
      message = "Prefer scala.util.Try(...).toResult — import org.adk4s.types.TryOps"
    },
    {
      id = NoKeywordCatch
      pattern = "(?s)\\bcatch\\s*\\{"
      message = "Prefer mapping Result errors instead of catch; use Try(...).toResult and .left.map/.fold"
    },
    {
      id = NoKeywordFinally
      pattern = "(?s)\\bfinally\\b"
      message = "Prefer ManagedResource/Using or ensure cleanup via dedicated combinators"
    },
    # ── spec: hermetic-test-processes — raw process construction bans ──
    # Test processes go through the shared HermeticEnv helper
    # (HermeticEnv.run / capture / captureMerged / processBuilder); a raw
    # construction inherits the invoking shell's environment wholesale — the
    # defect this spec removes. The helper sources are the sanctioned route
    # and carry `scalafix:ok` markers at their construction sites.
    {
      id = NoRawProcessBuilder
      pattern = "\\bnew\\s+(java\\.lang\\.)?ProcessBuilder\\b"
      message = "spec: hermetic-test-processes — construct test processes only through HermeticEnv.run/capture/captureMerged/processBuilder."
    },
    {
      # The scala. prefix is optional — `sys.process` resolves through the
      # Predef alias and spawns with the invoking environment all the same.
      id = NoScalaSysProcess
      pattern = "\\b(?:scala\\.)?sys\\.process\\b"
      message = "spec: hermetic-test-processes — scala.sys.process/sys.process spawns with the invoking environment; use the HermeticEnv helper."
    },
    {
      id = NoOsProc
      pattern = "\\bos\\.proc\\b"
      message = "spec: hermetic-test-processes — os.proc spawns with the invoking environment by default; use the HermeticEnv helper."
    },
    {
      # Java nullary methods are callable paren-less, so `pb.environment`
      # without `()` must not evade the ban.
      id = NoBuilderEnvMutation
      pattern = "\\.environment\\b"
      message = "spec: hermetic-test-processes — mutating a builder's environment revisits the hermetic decision; declare variables in the HermeticEnv instead."
    },
    {
      # Runtime.exec is the other idiomatic spawn path — it inherits the
      # full invoking environment and is just as non-hermetic.
      id = NoRuntimeExec
      pattern = "\\bRuntime\\s*\\.\\s*getRuntime\\b"
      message = "spec: hermetic-test-processes — Runtime.getRuntime.exec inherits the invoking environment; use the HermeticEnv helper."
    }
  ]
}
