# openspec/config.yaml — Project configuration for verified-scala3 schema
#
# This file is injected into ALL artifact instructions so the AI always
# has project context. The stack details live in capability-profile.md
# (regenerated per change) and the architecture in openspec/project.md —
# this file is a thin pointer, not a duplicate.

schema: verified-scala3

# ── Project Context ──────────────────────────────────────────────────────
# Injected into every artifact instruction. Keep short — the authoritative
# sources are the files referenced below, not this block.
context: |
  PROJECT: adk4s (Agent Development Kit for Scala 3) — a functional,
  type-safe agent toolkit built on llm4s, workflows4s, and smithy4s.
  It is a LIBRARY + examples project, not a service.

  AUTHORITATIVE SOURCES (read these, do not rely on this block for details):
  - openspec/capability-profile.md — detected stack: modules, versions,
    test/property frameworks, lint tools, formal verification setup.
    Regenerated per change. If this block disagrees with it, the profile wins.
  - openspec/project.md — module dependency graph, architecture components,
    key implementation patterns, common commands.
  - AGENTS.md / CLAUDE.md — coding conventions (functional-first, no
    isInstanceOf/asInstanceOf, no Any, explicit types, no wildcard imports).

  STACK QUICK REFERENCE (verify against capability-profile.md before use):
  - Scala 3.8.4, sbt, cats-effect 3, fs2, smithy4s, upickle (NOT circe)
  - Test: munit + Hedgehog (NOT ScalaTest, NOT ScalaCheck)
  - 12 modules (see build.sbt for the current list)
  - verified module: pinned to Scala 3.7.2 for Stainless (Ring 6)

# ── Per-Artifact Rules ───────────────────────────────────────────────────
# Only project-SPECIFIC rules that the schema's generic instruction blocks
# cannot encode. The schema already covers: Ring 3/8 mandatory, Given/When/Then,
# SHALL/MUST, typed-contract decision table, capability-profile detection
# procedure, concept-inventory scan, proof obligations, etc.
rules:
  proposal:
    - Reference concept-inventory.md for existing types before proposing new ones

  capability-profile:
    - Read project/Versions.scala and project/Dependencies.scala for exact versions
    - Note that -Werror is NOT active (warnings don't fail the build)
    - Record which WartRemover warts are excluded vs active (currently many are temporarily excluded)
    - Record that stryker4s.conf has a fixed mutate list — Ring 5 must retarget it per spec
    - Record that the `verified` module is pinned to Scala 3.7.2 for Stainless compatibility

  concept-inventory:
    - Scan all modules listed in build.sbt (currently 12 — check build.sbt for the current list)
    - Also scan llm4s types that are part of the public API surface (imported across modules)

  specs:
    - Properties must use Hedgehog (not ScalaCheck — not in the stack)
    - Properties extend `hedgehog.munit.HedgehogSuite` with `property("…") { for x <- gen.forAll yield <Result> }`

  spec-lint:
    - Verify properties use Hedgehog (not ScalaCheck — not in the stack)
