  fileFilter = "glob:adk4s-orchestration/src/main/scala/**"
  regex = [
    {
      id = NoUjsonInOrchestration
      pattern = "\\bujson\\.(Value|Num|Str|Bool|Null|Obj|Arr)\\b"
      message = "ujson.Value is confined to the llm4s boundary. Use JsonValue (= smithy4s.Document) in adk4s-orchestration."
    }
