DisableSyntax.NoUjsonInHarnessApi {
  fileFilter = "glob:adk4s-harness-api/src/main/scala/**"
  excludePackages = [
    "org.adk4s.harness"             # HarnessState uses ujson.Value as the serialization bridge (upickle ReadWriter ↔ JsonValue via JsonValueCodec)
  ]
  regex = [
    {
      id = NoUjsonInHarnessApi
      pattern = "\\bujson\\.(Value|Num|Str|Bool|Null|Obj|Arr)\\b"
      message = "ujson.Value is confined to the serialization bridge in org.adk4s.harness. Use JsonValue (= smithy4s.Document) everywhere else."
    }
  ]
}
