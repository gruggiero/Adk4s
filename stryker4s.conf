stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // Spec 7 (ledger-checkpoint-parity) — probatio-cli pass.
  // The entrypoint grammar (parse/validate ordering, forbidden flags,
  // double-dash splitting, exit-grammar), the wiring seams (subprocess
  // capture, ledger-file reads, sha256), and the error rendering.
  mutate = [
    "**/probatio/cli/SubcommandEntrypoints.scala",
    "**/probatio/cli/SubcommandWiring.scala",
    "**/probatio/cli/CliError.scala",
    "**/probatio/cli/CliErrorRender.scala",
    "**/probatio/cli/HelpRegistry.scala"
  ]

  // SubcommandEntrypoints carries every spec's subcommand — the filter
  // must cover the whole file, so ALL in-process cli suites run (each
  // subcommand's mutants face their own oracle; Stryker maps coverage
  // per-mutant). SubprocessConformanceSpec is excluded: it runs the
  // stale native artifact, which is invisible to JVM mutation anyway.
  test-filter = [
    "org.sinemenda.probatio.cli.ChainStateCmdConformanceSpec",
    "org.sinemenda.probatio.cli.ChainStateCmdSpec",
    "org.sinemenda.probatio.cli.ChainStateParitySpec",
    "org.sinemenda.probatio.cli.CheckpointCmdSpec",
    "org.sinemenda.probatio.cli.CliConformanceSpec",
    "org.sinemenda.probatio.cli.CliHelpSpec",
    "org.sinemenda.probatio.cli.CliOutputSpec",
    "org.sinemenda.probatio.cli.CliParseErrorSpec",
    "org.sinemenda.probatio.cli.CliSurfaceSpec",
    "org.sinemenda.probatio.cli.CliWiringCompileNegativeSpec",
    "org.sinemenda.probatio.cli.CliWiringContractSpec",
    "org.sinemenda.probatio.cli.DangerScanCmdSpec",
    "org.sinemenda.probatio.cli.EntrypointBridgeSpec",
    "org.sinemenda.probatio.cli.EntrypointContractSpec",
    "org.sinemenda.probatio.cli.ExitCodeSpec",
    "org.sinemenda.probatio.cli.ExitProtocolSpec",
    "org.sinemenda.probatio.cli.GateBannerCompatSpec",
    "org.sinemenda.probatio.cli.LedgerCheckpointParitySpec",
    "org.sinemenda.probatio.cli.LedgerCmdConformanceSpec",
    "org.sinemenda.probatio.cli.LedgerCmdProvenanceSpec",
    "org.sinemenda.probatio.cli.LedgerParitySpec",
    "org.sinemenda.probatio.cli.LiveFactBannerSpec",
    "org.sinemenda.probatio.cli.MulticallDispatchSpec",
    "org.sinemenda.probatio.cli.ProbatioDispatchSpec",
    "org.sinemenda.probatio.cli.ReconcileCmdSpec",
    "org.sinemenda.probatio.cli.RepositoryFactsSpec",
    "org.sinemenda.probatio.cli.SpecLintCmdSpec"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
}
