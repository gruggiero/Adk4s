stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 7 (install-tool-surface-parity) —
  // the two installer entrypoints (whole file, spec-4 convention: covered-
  // code score + in-diff survivor analysis) plus the new install types.
  mutate = [
    "**/probatio/cli/SubcommandEntrypoints.scala",
    "**/probatio/core/InstallSurface.scala"
  ]

  // Positive filter: the spec-7 suites. InstallSurfaceParitySpec and
  // SubprocessConformanceSpec are excluded — they subprocess the
  // predecessor scripts / native binary and cannot resolve the repo root
  // inside the Stryker sandbox (spec-5 precedent).
  test-filter = [
    "org.sinemenda.probatio.cli.InstallToolSurfaceParitySpec",
    "org.sinemenda.probatio.cli.InstallToolSurfaceParityCliTypeContract",
    "org.sinemenda.probatio.cli.CliHelpSpec",
    "org.sinemenda.probatio.cli.ProbatioDispatchSpec",
    "org.sinemenda.probatio.core.InstallToolSurfaceParityTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
