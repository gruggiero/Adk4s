stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // Spec 9 (native-gate-delivery) — PASS B: probatio-cli. The packaging
  // types plus SubcommandWiring, which carries the forgivePredicate
  // per-baseline batching. No test-filter — SubcommandWiring mutants are
  // covered across many cli suites; Stryker's coverage mapping runs only
  // the covering tests per mutant. (Plugin passes A1/A2 are complete:
  // A1 ProbatioPlugin 96% with StringLiteral excluded — every string
  // mutant lands on a settingKey/taskKey description literal, which sbt's
  // macro rejects at compile time; A2 ShimGenerator+InstallResolver 100%.)
  mutate = [
    "**/probatio/packaging/BudgetVerdict.scala",
    "**/probatio/packaging/LatencyMeasurement.scala",
    "**/probatio/packaging/ReleaseCheck.scala",
    "**/probatio/packaging/ReleaseManifestIO.scala",
    "**/probatio/packaging/ReleaseValidator.scala",
    "**/probatio/cli/SubcommandWiring.scala"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
