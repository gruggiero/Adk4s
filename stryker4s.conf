stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // finish-probatio-replacement spec 1 (hermetic-test-processes) —
  // the HermeticEnv environment builder + the single processBuilder route.
  // Run with:
  //   sbt "probatio-core/stryker"
  //
  // The file was moved from core test sources to main sources for this
  // run (Stryker4s only instruments main sources) — HermeticEnvGens stays
  // in test because it imports hedgehog, a test-scoped dependency.
  // Restore both halves afterwards.
  mutate = [
    "src/main/scala/org/sinemenda/probatio/migration/HermeticEnv.scala"
  ]

  // Positive filter: the spec-1 suites that observe the env content
  // (SessionIdSpec's declared-controls property + probeChild scenarios),
  // pin the API shape (type contract + compile-negative), and spawn real
  // processes through capture/run (ConformanceSpec, SwapOrderSpec,
  // CutoverRevertSpec). DifferentialHarnessSpec is excluded — 300s per
  // mutant is not viable and its env-independence coverage overlaps
  // SessionIdSpec's property.
  test-filter = [
    "org.sinemenda.probatio.core.SessionIdSpec",
    "org.sinemenda.probatio.migration.HermeticEnvSpec",
    "org.sinemenda.probatio.migration.HermeticEnvTypeContract",
    "org.sinemenda.probatio.migration.HermeticEnvCompileNegative",
    "org.sinemenda.probatio.migration.SwapOrderSpec",
    "org.sinemenda.probatio.migration.CutoverRevertSpec"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
