stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  mutate = [
    "**/probatio/core/ChainState.scala",
    "**/probatio/core/ChainStateReport.scala",
    "**/probatio/core/RequirementExtractor.scala"
  ]

  // Target the chain-state suites — compute pinpoint/property coverage,
  // report rendering, and requirement extraction. The predecessor-parity
  // corpus lives in probatio-cli (ChainStateParitySpec) and cannot cover
  // core mutants under this runner; parity is verified by Ring 3 instead.
  test-filter = [
    "org.sinemenda.probatio.core.ChainStateSpec",
    "org.sinemenda.probatio.core.ChainStateAttributionSpec",
    "org.sinemenda.probatio.core.ChainStateAttributionTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
}
