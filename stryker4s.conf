stryker4s {
  // Ring 5 — retarget to the changed production files per spec.
  // Re-point this glob to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  mutate = [
    "**/probatio/core/Validator.scala",
    "**/probatio/core/ProvenanceFields.scala",
    "**/probatio/core/Ledger.scala",
    "**/probatio/cli/SubcommandEntrypoints.scala"
  ]

  // Target provenance-related tests — ConformanceSpec takes ~17s and
  // fails in the Stryker4s forked environment.
  test-filter = [
    "org.sinemenda.probatio.core.ProvenanceValidatorSpec",
    "org.sinemenda.probatio.core.ContractViolation15Spec",
    "org.sinemenda.probatio.core.LedgerReadSpec",
    "org.sinemenda.probatio.core.LedgerSpec",
    "org.sinemenda.probatio.core.LedgerValidatorSpec"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
}
