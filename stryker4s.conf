stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // finish-probatio-replacement spec 7 (delivery-verified) —
  // the toolchain-identity tier: parse/readEmbedded markers, the verdict
  // algebra, per-binary validation, and the manifest-IO read. Run with:
  //   sbt "probatio-cli/stryker"
  mutate = [
    "src/main/scala/org/sinemenda/probatio/packaging/ToolchainIdentity.scala",
    "src/main/scala/org/sinemenda/probatio/packaging/ToolchainVerdict.scala",
    "src/main/scala/org/sinemenda/probatio/packaging/ReleaseValidator.scala",
    "src/main/scala/org/sinemenda/probatio/packaging/ReleaseManifestIO.scala",
    "src/main/scala/org/sinemenda/probatio/packaging/ReleaseCheck.scala"
  ]

  // Positive filter: in-process packaging exercisers — ReleaseManifestIOSpec
  // is the scenario/property oracle end-to-end through ReleaseCheck.run;
  // NativePackagingSpec covers validateAll paths; the contract specs pin
  // signatures. SubprocessConformanceSpec is excluded — it execs the built
  // artifacts, never the mutated classes.
  test-filter = [
    "org.sinemenda.probatio.packaging.ReleaseManifestIOSpec",
    "org.sinemenda.probatio.packaging.NativePackagingSpec",
    "org.sinemenda.probatio.packaging.DeliveryVerifiedTypeContract",
    "org.sinemenda.probatio.packaging.NativeGateDeliveryTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
}
