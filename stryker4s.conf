stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // finish-probatio-replacement spec 5 (oracle-independence) —
  // the sanction guard: classification, the baseline cut, the verdict
  // lattice and the record wire format. Run with:
  //   sbt "probatio-core/stryker"
  //
  // Guard sources live in test sources; moved to main for this run only
  // (Stryker collects coverage for main-source files), moved back after.
  mutate = [
    "src/main/scala/org/sinemenda/probatio/guard/OracleSanctionGuard.scala",
    "src/main/scala/org/sinemenda/probatio/guard/SanctionTypes.scala"
  ]

  // Positive filter: the guard suites — NonGoalsGuardSpec carries the
  // sanction scenarios and the iff/round-trip/no-structural properties;
  // the two type contracts pin signatures and compile-negatives.
  test-filter = [
    "org.sinemenda.probatio.guard.NonGoalsGuardSpec",
    "org.sinemenda.probatio.guard.OracleSanctionTypeContract",
    "org.sinemenda.probatio.guard.FeatureFreezeGuardIntegrityTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
}
