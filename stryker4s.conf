stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 9 (workflow-delivery-hygiene) —
  // the shim-generation decision code. Both targets live in sbt-probatio
  // main sources already, so no test→main move is needed. Run with:
  //   sbt "sbt-probatio/stryker"
  mutate = [
    "**/probatio/plugin/ShimGenerator.scala",
    "**/probatio/plugin/ShimTargetScope.scala"
  ]

  // Positive filter: the spec-9 suites that exercise generation and the
  // scope type. HookCutoverShimSpec is excluded — it materialises real
  // git clones/worktrees and cannot resolve inside the Stryker sandbox
  // (spec-5 precedent). PluginSourceLintSpec is excluded — it lints
  // committed files, not generator output.
  test-filter = [
    "org.sinemenda.probatio.plugin.ShimGeneratorSpec",
    "org.sinemenda.probatio.plugin.InstallResolverSpec",
    "org.sinemenda.probatio.plugin.WorkflowDeliveryHygieneTypeContract",
    "org.sinemenda.probatio.plugin.NativeGateDeliveryPluginTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
