stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 2 (chain-state-undetermined-fidelity) —
  // probatio-core. The PrePassOutcome boundary, the narrowed report
  // factory, the compute arms, and the one-line wire reason accessor.
  mutate = [
    "**/probatio/core/ChainState.scala",
    "**/probatio/core/ChainStateReport.scala",
    "**/probatio/core/PrePassOutcome.scala",
    "**/probatio/core/RepositoryFacts.scala"
  ]

  // Positive filter: only suites that cover the mutate targets.
  // OracleGreenCheck / OracleGreenGateSpec contain the
  // oracle-immutability git-diff checks, which fail while the retargeted
  // oracle source is uncommitted — a mutant-independent failure that
  // would poison the run.
  test-filter = [
    "org.sinemenda.probatio.core.ChainStateSpec",
    "org.sinemenda.probatio.core.ChainStateAttributionSpec",
    "org.sinemenda.probatio.core.VerifiedKernelBridgeSpec",
    "org.sinemenda.probatio.core.BannerEngineSpec",
    "org.sinemenda.probatio.core.BannerBridgeSpec",
    "org.sinemenda.probatio.core.CheckpointParitySpec",
    "org.sinemenda.probatio.core.ConformanceSpec",
    "org.sinemenda.probatio.core.ChainStateCompileNegative",
    "org.sinemenda.probatio.core.ChainStateUndeterminedFidelityTypeContract",
    "org.sinemenda.probatio.core.ChainStateAttributionTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
