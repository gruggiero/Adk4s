stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 1 (differential-harness-integrity) —
  // probatio-core. The arm-materialisation + divergence + diff/decide
  // surfaces. These files live in TEST sources; for this run they are
  // temporarily moved to main sources (Stryker collects main-source
  // coverage only) and moved back after the run.
  mutate = [
    "**/probatio/migration/ArmTypes.scala",
    "**/probatio/migration/DifferentialHarness.scala",
    "**/probatio/migration/SeamTypes.scala",
    "**/probatio/migration/SwapOrder.scala",
    "**/probatio/migration/CutoverGate.scala"
  ]

  // Positive filter: only suites that cover the mutate targets.
  // OracleDiffRunner runs the real 17-file bats suite per arm
  // (minutes, and worktree materialisation); OracleGreenCheck /
  // OracleGreenGateSpec contain the oracle-immutability git-diff checks,
  // which fail while the retargeted oracle source is uncommitted — a
  // mutant-independent failure that would poison the run.
  test-filter = [
    "org.sinemenda.probatio.migration.DifferentialHarnessSpec",
    "org.sinemenda.probatio.migration.SwapOrderSpec",
    "org.sinemenda.probatio.migration.CutoverGateSpec",
    "org.sinemenda.probatio.migration.CutoverRevertSpec",
    "org.sinemenda.probatio.migration.CutoverBridgeSpec",
    "org.sinemenda.probatio.migration.HookCutoverSpec",
    "org.sinemenda.probatio.migration.DifferentialHarnessCompileNegative",
    "org.sinemenda.probatio.migration.DifferentialHarnessIntegrityTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
