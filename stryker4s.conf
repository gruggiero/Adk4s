stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 5 (graph-tool-port) —
  // probatio-core run: the graph model, the three source parsers, the
  // builder, the reachability audit, and the wire codec.
  mutate = [
    "**/probatio/core/GraphNode.scala",
    "**/probatio/core/GraphEdge.scala",
    "**/probatio/core/GraphBuild.scala",
    "**/probatio/core/GraphParse.scala",
    "**/probatio/core/ConceptRegistryDoc.scala",
    "**/probatio/core/InventoryDoc.scala",
    "**/probatio/core/SpecGraphDoc.scala",
    "**/probatio/core/TraceabilityGraph.scala",
    "**/probatio/core/GraphAudit.scala",
    "**/probatio/core/GraphQuery.scala",
    "**/probatio/core/GraphWire.scala",
    "**/probatio/core/ReachabilityResult.scala",
    "**/probatio/core/UnlinkableRow.scala"
  ]

  // Positive filter: only suites that cover the graph surface —
  // the oracle's scenario/property section, the kernel bridge, and the
  // conformance runs (which spawn the predecessor per case) are
  // EXCLUDED: ConformanceSpec shells out to python3 openspec-graph.py
  // via a repo-root resolution that cannot run inside the stryker
  // sandbox — the initial run fails for sandbox reasons, not red tests.
  test-filter = [
    "org.sinemenda.probatio.core.SpecLintEngineSpec",
    "org.sinemenda.probatio.core.GraphToolPortTypeContract",
    "org.sinemenda.probatio.core.VerifiedKernelBridgeSpec"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
