stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 10 (schema-rename-completion) —
  // the recorded deferral, the banner identity strings, and the cache
  // migration caller. Run with:
  //   sbt "probatio-core/stryker"   (RenameDeferral, BannerEngine)
  //   sbt "probatio-cli/stryker"    (CacheMigration, ProbatioMain)
  mutate = [
    "**/probatio/core/RenameDeferral.scala",
    "**/probatio/core/BannerEngine.scala",
    "**/probatio/cli/CacheMigration.scala",
    "**/probatio/cli/ProbatioMain.scala"
  ]

  // Positive filter: the spec-10 suites exercising the mutated code.
  // SubprocessConformanceSpec is excluded — it spawns the fixed native
  // binary, so it cannot observe JVM mutations (the call-site mutant is
  // covered by that spec at artifact level, reported as a justified
  // survivor instead).
  test-filter = [
    "org.sinemenda.probatio.core.SchemaRenameCompletionTypeContract",
    "org.sinemenda.probatio.core.SchemaPolicySpec",
    "org.sinemenda.probatio.core.DriftScanSpec",
    "org.sinemenda.probatio.core.BannerEngineSpec",
    "org.sinemenda.probatio.cli.CacheMigrationSpec",
    "org.sinemenda.probatio.cli.LiveFactBannerTypeContract",
    "org.sinemenda.probatio.cli.LiveFactBannerSpec",
    "org.sinemenda.probatio.migration.MigrationProtocolSpec"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
