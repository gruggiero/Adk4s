stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 11 (unported-tool-register) —
  // the classification and register types. Run with:
  //   sbt "probatio-core/stryker"   (UnportedTool, UnportedToolRegister)
  //
  // Boundary: the `metals stop` port lives in the shared
  // SubcommandEntrypoints.scala (4.7k lines) — outside this run's target
  // per the spec's Ring-5 note; its coverage is the two dedicated tests
  // in MigrationProtocolSpec (no-instance and live-pid paths).
  mutate = [
    "**/probatio/core/UnportedTool.scala",
    "**/probatio/core/UnportedToolRegister.scala"
  ]

  // Positive filter: the spec-11 suites exercising the mutated code.
  // The cli-side oracle (MigrationProtocolSpec) cannot observe
  // probatio-core mutations — UnportedToolRegisterSpec is the
  // core-local coverage suite added for this run.
  test-filter = [
    "org.sinemenda.probatio.core.UnportedToolRegisterSpec",
    "org.sinemenda.probatio.core.UnportedToolRegisterTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
