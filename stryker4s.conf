stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 3 (completion-witness-refusal) —
  // probatio-core. The verdict enum + probes, the corroboration and
  // completion decision predicates, and the report's warrant view.
  mutate = [
    "**/probatio/core/WitnessVerdict.scala",
    "**/probatio/core/GateDecisions.scala",
    "**/probatio/core/ReconcileEngine.scala"
  ]

  // Positive filter: only suites that cover the mutate targets.
  // OracleGreenCheck / OracleGreenGateSpec contain the
  // oracle-immutability git-diff checks, which fail while the retargeted
  // oracle source is uncommitted — a mutant-independent failure that
  // would poison the run.
  test-filter = [
    "org.sinemenda.probatio.core.GateDecisionSpec",
    "org.sinemenda.probatio.core.GateEventCompletenessTypeContract",
    "org.sinemenda.probatio.core.CompletionWitnessRefusalTypeContract",
    "org.sinemenda.probatio.core.CompletionWitnessRefusalCompileNegative",
    "org.sinemenda.probatio.core.ReconcileEngineSpec",
    "org.sinemenda.probatio.core.ReconcileBridgeSpec",
    "org.sinemenda.probatio.core.DangerReconcileTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
