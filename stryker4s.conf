stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // finish-probatio-replacement spec 6 (oracle-fixture-repair) —
  // the caller side of the pre-execution tier: GateCmd's ToolNameSource
  // construction and absent-name diagnostic wiring. Run with:
  //   sbt "probatio-cli/stryker"
  mutate = [
    "src/main/scala/org/sinemenda/probatio/cli/GateCmd.scala"
  ]

  // Positive filter: in-process GateCmd exercisers — GateEventSpec is the
  // scenario oracle end-to-end through GateCmd.run; the banner/state-dir
  // suites cover adjacent paths. SubprocessConformanceSpec is excluded —
  // it execs the built artifacts, never the mutated classes.
  test-filter = [
    "org.sinemenda.probatio.cli.GateEventSpec",
    "org.sinemenda.probatio.cli.GateBannerCompatSpec",
    "org.sinemenda.probatio.cli.GateStateDirSpec",
    "org.sinemenda.probatio.cli.GateEventCompletenessCliTypeContract"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
}
