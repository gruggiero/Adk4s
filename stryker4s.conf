stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 8 (ledger-checkpoint-cutover) —
  // the swap-authorisation decision code (spec-1 convention: files moved
  // test→main for coverage, then restored; covered-code score + in-diff
  // survivor analysis).
  mutate = [
    "**/probatio/migration/CutoverGate.scala",
    "**/probatio/migration/DifferentialResult.scala",
    "**/probatio/migration/ShimSwap.scala",
    "**/probatio/core/Validator.scala"
  ]

  // Positive filter: the spec-8 suites that exercise the decision code.
  // SeamSwapExec/CutoverRevertSpec are excluded — they materialise real
  // git worktrees / temp repos and cannot resolve inside the Stryker
  // sandbox (spec-5 precedent). Validator.scala is in scope: spec 8's
  // Ring-8 remediation changed its integer domain and timestamp shape —
  // the validator specs are its exercising suites.
  test-filter = [
    "org.sinemenda.probatio.migration.CutoverGateSpec",
    "org.sinemenda.probatio.migration.HookCutoverSpec",
    "org.sinemenda.probatio.migration.DifferentialHarnessSpec",
    "org.sinemenda.probatio.migration.SwapOrderSpec",
    "org.sinemenda.probatio.migration.LedgerCheckpointCutoverTypeContract",
    "org.sinemenda.probatio.core.LedgerValidatorSpec",
    "org.sinemenda.probatio.core.ProvenanceValidatorSpec",
    "org.sinemenda.probatio.core.LedgerRecordRoundTripSpec"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
