stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // repair-probatio-cutover spec 4 (gate-event-compatibility) —
  // probatio-cli run: the gate-entry dispatch (SubcommandEntrypoints).
  // probatio-core run recorded separately: EventDispatch.scala,
  // GateEventCompletenessTypeContract filter, score 100.0% (9 mutants,
  // 3 tested, all killed).
  mutate = [
    "**/probatio/cli/SubcommandEntrypoints.scala"
  ]

  // Positive filter: only suites that cover the gate-entry region.
  // OracleGreenCheck / OracleGreenGateSpec contain the
  // oracle-immutability git-diff checks, which fail while the retargeted
  // oracle source is uncommitted — a mutant-independent failure that
  // would poison the run.
  test-filter = [
    "org.sinemenda.probatio.cli.GateEventSpec",
    "org.sinemenda.probatio.cli.GateBannerCompatSpec",
    "org.sinemenda.probatio.cli.GateStateDirSpec",
    "org.sinemenda.probatio.cli.SubprocessConformanceSpec",
    "org.sinemenda.probatio.cli.GateBridgeSpec",
    "org.sinemenda.probatio.cli.LiveFactBannerSpec",
    "org.sinemenda.probatio.cli.GateEventCompletenessCliTypeContract",
    "org.sinemenda.probatio.cli.EntrypointContractSpec",
    "org.sinemenda.probatio.cli.EntrypointContractTypeContract",
    "org.sinemenda.probatio.cli.EntrypointBridgeSpec",
    "org.sinemenda.probatio.cli.MulticallDispatchSpec",
    "org.sinemenda.probatio.cli.ProbatioDispatchSpec"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
