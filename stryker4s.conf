stryker4s {
  // Ring 5 — retarget to each spec's changed files before running.
  // Globs are resolved relative to the mutated module's base dir, so use
  // base-agnostic `**` patterns rather than repo-root paths.
  //
  // NOTE: Stryker4s only collects coverage for main-source files. When
  // the implementation lives in test sources (as with cutover-gate),
  // temporarily move the mutate-target files to main sources, run
  // Stryker4s, then move them back. See implementation-progress.md
  // Ring 5 notes for the cutover-gate run.
  //
  // Example for structured-llm:
  //   mutate = ["**/sap/SchemaAlignedParser.scala"]
  // Example for adk4s-core:
  //   mutate = ["**/tools/ToolsNode.scala"]

  // finish-probatio-replacement spec 2 (jar-launcher-dispatch) —
  // the dispatch algebra: source classification + name construction +
  // the resolveAndSplit lattice. Run with:
  //   sbt "probatio-cli/stryker"
  //
  // ProbatioMain is excluded — its mutations live behind argv0/streams IO
  // that no in-process suite observes; the dispatch logic it calls is
  // covered via MulticallDispatch mutants. ArmTree lives in test sources
  // and the launcher is a shell script — both outside stryker's reach.
  mutate = [
    "src/main/scala/org/sinemenda/probatio/cli/InvocationSource.scala",
    "src/main/scala/org/sinemenda/probatio/cli/InvocationName.scala",
    "src/main/scala/org/sinemenda/probatio/cli/MulticallDispatch.scala"
  ]

  // Positive filter: in-process dispatch suites only — the scenario +
  // property oracles (MulticallDispatchSpec), the surface pins
  // (ProbatioDispatchSpec, InstallToolSurfaceParitySpec), and the
  // formal-model bridge (EntrypointBridgeSpec). SubprocessConformanceSpec
  // is excluded — it execs the built artifacts, never the mutated classes.
  test-filter = [
    "org.sinemenda.probatio.cli.MulticallDispatchSpec",
    "org.sinemenda.probatio.cli.ProbatioDispatchSpec",
    "org.sinemenda.probatio.cli.InstallToolSurfaceParitySpec",
    "org.sinemenda.probatio.cli.EntrypointBridgeSpec",
    "org.sinemenda.probatio.cli.EntrypointContractSpec"
  ]

  thresholds {
    high = 90
    low = 80
    break = 0
  }
  debug {
    log-test-runner-stdout = true
  }
}
